name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Dashboard build and browser fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check && npm run typecheck && npm test && npm run build
        working-directory: frontend
      - name: Verify pinned Nginx response headers
        run: node tests/nginx-smoke.mjs
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env:
          CI: "true"
  infrastructure:
    name: Kubernetes service-free manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate pinned tools, Kustomize, built-in schemas and Helm
        run: bash infra/k8s/scripts/validate.sh
  quality:
    name: Python 3.12 quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/uv
          key: ${{ runner.os }}-python-3.12-uv-${{ hashFiles('uv.lock') }}
      - name: Install locked dependencies
        run: make setup
      - name: Run lint, formatting checks, and unit tests
        run: make check
      - name: Install optional API and search dependencies (no Spark)
        run: .tools/uv/bin/uv sync --locked --extra kafka --extra search --extra api
        env:
          UV_CACHE_DIR: .cache/uv
          UV_PYTHON_INSTALL_DIR: .tools/python
          TMPDIR: .cache/tmp
      - name: Run service-free API tests
        run: make api-test

  spark:
    name: Spark transformation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Spark dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/uv
          key: ${{ runner.os }}-python-3.12-spark-uv-${{ hashFiles('uv.lock') }}
      - name: Install locked Spark dependencies
        run: make spark-setup
      - name: Run service-free Spark SQL tests
        run: make spark-test
