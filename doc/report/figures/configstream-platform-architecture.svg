<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial,Helvetica,sans-serif">
<title>ConfigStream evidence gates and authoritative publication</title>
<desc>Four evidence lanes (configuration, RPKI, RIS, DNS) each pass a claim gate and become a typed temporal record. All lanes are committed once to authoritative Parquet datasets and a manifest. Analytics and search/API/dashboard read the committed history and can be rebuilt.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17212b"/></marker></defs>
<rect width="1600" height="900" fill="#fff"/>
<text x="40" y="56" font-size="32" fill="#17212b" text-anchor="start" font-weight="700">ConfigStream: claim gates turn evidence into auditable temporal records</text>
<text x="40" y="88" font-size="17" fill="#536575" text-anchor="start">Each lane keeps its own identity and temporal condition. One commit is authoritative; search and API are rebuilt from it.</text>
<text x="40" y="140" font-size="15" fill="#536575" text-anchor="start" font-weight="700" letter-spacing="1.2">01  SOURCE EVIDENCE</text>
