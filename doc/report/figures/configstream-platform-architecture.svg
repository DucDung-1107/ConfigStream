<text x="1340" y="140" font-size="15" fill="#536575" text-anchor="start" font-weight="700" letter-spacing="1.2">05  CONSUMERS</text>
<path d="M1340 150H1560" stroke="#9a5268" stroke-width="3"/>
<rect x="40" y="170" width="260" height="110" rx="12" fill="#e8f2f5" stroke="#3b7180" stroke-width="2.4"/>
<text x="60" y="206" font-size="19" fill="#17212b" text-anchor="start" font-weight="700">ConfigSnapshot</text>
<text x="60" y="232" font-size="15" fill="#536575" text-anchor="start">asset · version · payload</text>
<rect x="350" y="170" width="360" height="110" rx="12" fill="#f7f0df" stroke="#a97922" stroke-width="2.4"/>
<text x="370" y="206" font-size="19" fill="#17212b" text-anchor="start" font-weight="700">Version adjacency</text>
<text x="370" y="232" font-size="15" fill="#536575" text-anchor="start">buffered producer order</text>
<rect x="760" y="170" width="260" height="110" rx="12" fill="#eaf1f8" stroke="#3f6f9b" stroke-width="2.4"/>
<text x="780" y="206" font-size="19" fill="#17212b" text-anchor="start" font-weight="700">ConfigTransition</text>
