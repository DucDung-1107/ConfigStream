worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location = /frontend-healthz { return 200 "ok\n"; }
    location ~ ^/(healthz|readyz)$ {
      limit_except GET { deny all; }
      proxy_pass http://api.cs-app.svc.cluster.local:8000;
      proxy_read_timeout 5s;
      add_header Cache-Control no-store;
    }
    location ~ ^/api/v1/(snapshots|diffs|alerts|assets)(/|$) {
      limit_except GET { deny all; }
      proxy_pass http://api.cs-app.svc.cluster.local:8000;
      proxy_read_timeout 10s;
      add_header Cache-Control no-store;
    }
    location /api/ { return 404; }
    location /research/ { try_files $uri =404; add_header Cache-Control no-store; }
    location / { try_files $uri $uri/ =404; }
  }
}
