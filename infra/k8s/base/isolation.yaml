apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-clients-only
  namespace: cs-infra
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              configstream.local/access: internal
