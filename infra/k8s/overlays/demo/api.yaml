apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cs-app
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cs-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        configstream-owned: phase20k
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        runAsGroup: 185
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: configstream-k8s:07e931e
          imagePullPolicy: Never
          command: [python, -m, api.main]
          envFrom:
            - secretRef:
                name: closure-search-reader
          env:
            - name: CONFIGSTREAM_API_HOST
              value: 0.0.0.0
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch.cs-app.svc.cluster.local:9200
            - name: CONFIGSTREAM_SEARCH_INDEX_PREFIX
              value: cs20k1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
