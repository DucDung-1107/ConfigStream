apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: single
  namespace: cs-infra
  labels:
    strimzi.io/cluster: configstream
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: persistent-claim
    size: 2Gi
    class: local-path
    deleteClaim: false
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: configstream
  namespace: cs-infra
spec:
  kafka:
    version: 4.1.1
    image: quay.io/strimzi/kafka:0.51.0-kafka-4.1.1@sha256:3c35c34d09747086b1115989613a25feae161fa6deb0abc9c54b54016eae3a27
    listeners:
      - name: internal
        port: 9092
        type: internal
        tls: false
    config:
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      auto.create.topics.enable: false
      log.retention.hours: 24
      log.retention.bytes: 268435456
      log.segment.bytes: 16777216
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: config.snapshots
  namespace: cs-infra
  labels:
    strimzi.io/cluster: configstream
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 86400000
    retention.bytes: 268435456
