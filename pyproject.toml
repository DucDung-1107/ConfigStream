[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "configstream"
version = "0.1.0"
description = "Scalable Configuration Change Storage and Analytics Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3", "PyYAML==6.0.2"]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.6,<3"]
spark = ["pyspark==4.0.2", "pandas==2.2.3", "pyarrow==19.0.1", "protobuf==5.29.5"]
lake = ["boto3==1.40.45"]
search = ["elasticsearch==9.5.1"]
api = ["fastapi==0.143.0", "uvicorn==0.54.0", "httpx==0.28.1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["schemas", "generator", "messaging", "spark", "processing", "lake", "search", "api", "workloads", "analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a running Kafka broker and initialized topics",
    "spark_integration: requires local Spark, Java 21, Kafka, and the Kafka connector",
    "lake_integration: requires local Spark, Kafka, MinIO, and the S3A connector",
    "search_integration: requires local Elasticsearch; full pipeline also needs Kafka and MinIO",
    "api_integration: requires local Elasticsearch; end-to-end also needs Kafka and MinIO",
    "phase10_integration: requires local Kafka, MinIO, Spark and the pinned fixture baseline",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
